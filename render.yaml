databases:
  - name: burnout-db
    databaseName: burnout
    user: burnout
    plan: free

services:
  - type: web
    name: burnout-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: burnout-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: burnout-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: burnout-backend
          property: host
          format: https://{host}
